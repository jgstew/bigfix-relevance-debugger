---
# run on staged files:          pre-commit
# install the git hook:         pre-commit install
# check all files in repo:      pre-commit run --all-files
# include the slower hooks:     pre-commit run --all-files --hook-stage manual
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-ast
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: detect-private-key
      - id: debug-statements
      - id: name-tests-test
        args: ["--pytest-test-first"]
        exclude: ^tests/conftest\.py$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: a56c0b927e6465d37cae3e97d35d4d18ab2b96cd # v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # The workflows in .github/: check-github-workflows validates the schema,
  # actionlint what they do (expressions, references, and shellcheck on
  # `run:` blocks when shellcheck is on PATH), zizmor the security.
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0494aa7fa1314e98913a41227d8f0a515b2c1049 # 0.38.2
    hooks:
      - id: check-github-workflows
        stages: [manual]
      - id: check-dependabot
        stages: [manual]

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
    hooks:
      - id: actionlint
        stages: [pre-push, manual]

  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2 # v1.30.1
    hooks:
      # Runs offline unless GH_TOKEN (or GITHUB_TOKEN) is set; export
      # GH_TOKEN="$(gh auth token)" for the online audits locally. CI sets it.
      - id: zizmor
        stages: [pre-push, manual]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: fecaddcd0b0601a3c02f729ae7a110511d2b52a6 # 0.12.20
    hooks:
      - id: uv-lock

  - repo: local
    hooks:
      - id: pyright
        name: pyright (uv run pyright src tests)
        language: system
        pass_filenames: false
        types: [python]
        entry: uv run --frozen pyright src tests
      - id: pytest
        name: pytest (offline unit suite)
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push, manual]
        entry: uv run --frozen pytest -q
