# XcodeGen spec (brew install xcodegen; then `xcodegen generate`).
# Run ./prepare.sh first: it fetches python.org's Python.xcframework, builds
# pydantic-core for iOS and fills app_packages/ (all git-ignored).
name: BigFixRelevanceNiceGUI
options:
  bundleIdPrefix: com.github.jgstew
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  BigFixRelevanceNiceGUI:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: app
        type: folder
        buildPhase: resources
      - path: app_packages
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Python.xcframework
        embed: true
      - sdk: WebKit.framework
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: BigFix Relevance (NiceGUI)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # The NiceGUI server is plain http on 127.0.0.1 inside the app.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.jgstew.bigfix-relevance-nicegui
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.0.1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/BigFixRelevance-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(BUILT_PRODUCTS_DIR)/Python.framework/Headers"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
    postBuildScripts:
      - name: Install Python standard library and convert .so to frameworks
        basedOnDependencyAnalysis: false
        script: |
          set -e
          source "$PROJECT_DIR/Python.xcframework/build/utils.sh"
          install_python Python.xcframework app app_packages
