[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bfrd-mobile-core"
version = "0.0.1"
description = "Spike: the UI-free core shared by the iOS/macOS proofs of concept (issue #33)."
requires-python = ">=3.11"
# Everything here is pure Python, so it installs on iOS/Android unchanged.
# bigfix-remote-client-relevance is installed with --no-deps by the app
# builds (its docker/asyncssh/zstandard deps are compiled and unused by
# Fast Query); these are the deps its import actually needs.
dependencies = [
    "bigfix-relevance-analyzer>=1.39.2,<2",
    "bigfix-remote-session-relevance>=1.3.0,<2",
    "platformdirs",
    "requests",
    "beautifulsoup4",
]

[project.optional-dependencies]
fastquery = ["bigfix-remote-client-relevance>=1.9.0,<2"]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/bfrd_mobile_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { bigfix-relevance-analyzer = "0 days", bigfix-remote-client-relevance = "0 days", bigfix-remote-session-relevance = "0 days" }
