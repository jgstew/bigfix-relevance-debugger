# Spike for issue #33: BeeWare (Toga + Briefcase). Generated by
# `briefcase new` 0.4.7, then trimmed to macOS + iOS (Android stubbed).
[tool.briefcase]
project_name = "bigfix-relevance-toga"
bundle = "com.github.jgstew"
version = "0.0.1"
url = "https://github.com/jgstew/bigfix-relevance-debugger"
license = "MIT"
license-files = ["LICENSE"]
author = "JGStew"
author_email = "admin@jgstew.com"

[tool.briefcase.app.bfrd_toga]
formal_name = "BigFix Relevance"
description = "Toga proof of concept for issue 33"
long_description = "Edit, analyze and evaluate BigFix relevance."
# The shared core is copied in as a source package (pip can't install a
# local directory for iOS: it only takes wheels for that platform).
sources = [
    "src/bfrd_toga",
    "../core/src/bfrd_mobile_core",
]
# --no-deps, and the full pure-Python closure spelled out: the client
# library's own deps (docker, asyncssh -> cryptography, zstandard) are
# compiled, have no iOS wheels, and Fast Query doesn't use them.
requirement_installer_args = ["--no-deps"]
requires = [
    "bigfix-relevance-analyzer==1.39.2",
    "bigfix-remote-session-relevance==1.3.0",
    "bigfix-remote-client-relevance==1.9.0",
    "anyio==4.15.1",
    "beautifulsoup4==4.15.0",
    "certifi==2026.10.19",
    "charset-normalizer==3.5.2",
    "defusedxml==0.7.1",
    "filelock==4.2.4",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.20",
    "platformdirs==4.13.5",
    "requests==2.34.2",
    "soupsieve==3.0.4",
    "tomlkit==0.15.2",
    "typing-extensions==4.16.0",
    "urllib3==2.8.0",
    # Toga, shared by every backend
    "toga-core==0.5.7",
    "travertino==0.5.7",
    "rubicon-objc==0.5.7",
    "fonttools==4.67.0",
]

[tool.briefcase.app.bfrd_toga.macOS]
universal_build = false
requires = [
    "toga-cocoa==0.5.7",
    "packaging==26.3",
    "std-nslog~=2.0.0",
]

[tool.briefcase.app.bfrd_toga.iOS]
requires = [
    "toga-iOS==0.5.7",
]

[tool.briefcase.app.bfrd_toga.android]
requires = [
    "toga-android==0.5.7",
]
base_theme = "Theme.MaterialComponents.Light.DarkActionBar"
build_gradle_dependencies = [
    "com.google.android.material:material:1.13.0",
    "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0",  # DetailedList
]
