---
name: install uv
description: >-
  Set up Python, then pip-install the uv version pinned in
  .pre-commit-config.yaml. Needs the repo checked out first.

inputs:
  python-version:
    description: the Python to set up and install uv into
    required: true

outputs:
  uv-version:
    description: the uv version that was installed
    value: ${{ steps.read.outputs.uv-version }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    # Single source of truth for the uv version: the `rev` of the
    # astral-sh/uv-pre-commit repo in .pre-commit-config.yaml, which
    # `pre-commit autoupdate` already keeps current. Read with awk rather than
    # a yaml parser so it needs nothing installed first. `rev` is SHA-pinned
    # with the version in a trailing `# X.Y.Z` comment, so the version comes
    # from that comment; fall back to the bare `rev` value for a tag-pinned rev
    # with no comment.
    - name: read uv version from .pre-commit-config.yaml
      id: read
      shell: bash
      run: |
        UV_VERSION="$(awk '
          /^[[:space:]]*-[[:space:]]*repo:.*astral-sh\/uv-pre-commit[[:space:]]*$/ { found = 1; next }
          found && $1 == "rev:" {
            if (match($0, /#[ \t]*(frozen:[ \t]*)?[vV]?[0-9]+(\.[0-9]+)*/)) {
              ver = substr($0, RSTART, RLENGTH)
              sub(/^#[ \t]*(frozen:[ \t]*)?[vV]?/, "", ver)
            } else {
              ver = $2
              gsub(/["'\'']/, "", ver)
              sub(/^[vV]/, "", ver)
            }
            print ver
            exit
          }
        ' .pre-commit-config.yaml)"
        if [ -z "$UV_VERSION" ]; then
          echo "::error::could not read the astral-sh/uv-pre-commit version from .pre-commit-config.yaml"
          exit 1
        fi
        echo "uv-version=$UV_VERSION" >> "$GITHUB_OUTPUT"
        echo "uv version: $UV_VERSION"

    - name: install uv
      shell: bash
      env:
        UV_VERSION: ${{ steps.read.outputs.uv-version }}
      run: python -m pip install "uv==${UV_VERSION}"
