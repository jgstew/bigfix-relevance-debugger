---
name: test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  # so .github/workflows/tag_and_release.yaml can gate a release on these
  # exact jobs rather than polling for other checks to go green
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow keeps a workflow_call from tag_and_release.yaml out of the
  # group a push to main starts for this workflow on its own
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the oldest version requires-python allows, and the newest in the
        # classifiers; keep both in step with pyproject.toml
        python: ["3.11", "3.13"]
    env:
      # overrides .python-version for every uv command below
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # setup-python, then the uv version pinned in .pre-commit-config.yaml.
      # `./` rather than zizmor's preferred `$/`, which actionlint v1.7.12
      # rejects (rhysd/actionlint#711, #732), as in the analyzer.
      - uses: ./.github/actions/install-uv # zizmor: ignore[self-repository]
        with:
          python-version: ${{ matrix.python }}

      - name: uv sync --locked
        run: uv sync --locked

      # flags live in [tool.pytest.ini_options] in pyproject.toml, not here
      - name: pytest
        run: uv run --frozen pytest

      - name: ruff check
        run: uv run --frozen ruff check src tests

      - name: ruff format --check
        run: uv run --frozen ruff format --check src tests

      - name: pyright
        run: uv run --frozen pyright src tests

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # same install-uv action as above
      - uses: ./.github/actions/install-uv # zizmor: ignore[self-repository]
        with:
          python-version: "3.13"

      - name: uv build (wheel + sdist)
        run: uv build

      # cheap, and makes a test run's hashes comparable to the released ones
      - name: sha256 of the built artifacts
        run: sha256sum dist/*

      # The smoke job tests these exact bytes on every OS, rather than each
      # runner building its own, and tag_and_release.yaml publishes them.
      # overwrite: a "Re-run all jobs" builds again in the same run.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-dist
          path: dist/
          if-no-files-found: error
          overwrite: true

  # Runs the built wheel the way users will: `uvx` installs it and its
  # dependencies from PyPI into a throwaway environment, so a dependency with
  # no wheel for a platform fails here. --version and --help import the app
  # (NiceGUI and the three BigFix libraries) but not pywebview; the last step
  # imports that and its native backend. Nothing here opens a window.
  smoke:
    name: wheel smoke test (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        # Git Bash on Windows, so the dist/*.whl glob and the script below
        # work the same on all three
        shell: bash
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # same install-uv action as above
      - uses: ./.github/actions/install-uv # zizmor: ignore[self-repository]
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-dist
          path: dist

      # --version must print the version in pyproject.toml: __version__ comes
      # from the installed metadata, so this also proves the wheel's metadata
      # is what a release would tag.
      - name: uvx --from <wheel> bigfix-relevance-debugger --version and --help
        run: |
          expected="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          wheel="$(ls dist/*.whl)"
          # tr: Python on Windows ends the line with \r\n, and $() keeps the \r
          got="$(uvx --isolated --from "$wheel" bigfix-relevance-debugger --version | tr -d '\r')"
          echo "$got"
          if [ "$got" != "bigfix-relevance-debugger ${expected}" ]; then
            echo "::error::expected 'bigfix-relevance-debugger ${expected}', got '${got}'"
            exit 1
          fi
          uvx --isolated --from "$wheel" bigfix-relevance-debugger --help

      # --version and --help never touch pywebview: argparse exits before the
      # app looks for it, and even then it only find_spec()s it. pywebview
      # imports its backend lazily, when a window opens, so a pythonnet or
      # PyObjC that installs but can't load would only show up on a user's
      # first launch (as a crash, or the browser fallback). Import the backend
      # that pywebview's guilib.initialize() would pick: winforms (pythonnet
      # and the .NET CLR) on Windows, cocoa (PyObjC) on macOS. Linux has no
      # toolkit by default and opens a browser tab instead, as documented, so
      # there it only checks that pywebview itself imports.
      - name: import pywebview and its native backend from the wheel
        run: |
          wheel="$(ls dist/*.whl)"
          uv run --isolated --no-project --with "$wheel" python - <<'EOF'
          import importlib
          import platform
          from importlib.metadata import version

          import webview  # noqa: F401

          from bigfix_relevance_debugger import app

          backend = {
              "Windows": "webview.platforms.winforms",
              "Darwin": "webview.platforms.cocoa",
          }.get(platform.system())
          if backend:
              importlib.import_module(backend)
              problem = app.native_window_problem()
              assert problem is None, f"native window unavailable: {problem}"
          print(f"pywebview {version('pywebview')}, backend: {backend or 'none (browser tab)'}")
          EOF
