---
# Tags, releases and publishes to PyPI on a version bump. Nothing here bumps
# the version: change `[project] version` in pyproject.toml in a PR, merge it
# to main, and this workflow does the rest. A cut-down version of
# bigfix-relevance-analyzer's, which also builds a playground and a VS Code
# extension; here the wheel and sdist are the only assets.
name: Tag and Release

on:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - ".github/workflows/tag_and_release.yaml"
      - ".github/workflows/test.yaml"
      - ".github/workflows/pre-commit.yaml"
      - ".github/actions/**"
  # a re-run path for when a release run failed after the version was already
  # merged, and for the first release; the tag check below still makes it a
  # no-op if the tag exists
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One release at a time, repo-wide. Releases only happen from main (see the
  # `version` job), so keying on github.ref would only add a way to overlap.
  # Serializing also keeps the tag check sound: a draft has no tag until it's
  # published, so a second run that started mid-release would see no tag and
  # try to release the same version again.
  # Deliberately no cancel-in-progress: never kill a release mid-flight.
  # GitHub keeps at most ONE pending run per group: a newer queued run
  # replaces an older queued one (never the running one). The newer run
  # releases whatever version its own commit has, so an intermediate bump
  # whose run got replaced is skipped, not released late.
  group: release

jobs:
  # Decides whether there is anything to do, so the jobs below can be skipped
  # outright. A push that touches src/** without bumping the version gets a
  # green, near-instant run and no release.
  version:
    name: Check for an untagged version
    runs-on: ubuntu-latest
    # Every later job needs this one, so skipping it skips the whole release.
    # fork guard: a fork that pushes to its own main should not try to release.
    # main guard: `push` is already limited to main, but workflow_dispatch can
    # be started from any branch, and would release that branch's version.
    # PYPI_PUBLISH guard: unlike the analyzer, which gates only its PyPI step,
    # this gates the whole release. For this repo PyPI is the point of a
    # release, and a GitHub-only release would tag the version, so the tag
    # check would never publish it to PyPI later. Until the repository
    # variable PYPI_PUBLISH is `true` (Settings > Secrets and variables >
    # Actions > Variables), every run is a green no-op.
    if: >-
      github.repository == 'jgstew/bigfix-relevance-debugger'
      && github.ref == 'refs/heads/main'
      && vars.PYPI_PUBLISH == 'true'
    outputs:
      version: ${{ steps.getversion.outputs.version }}
      release_needed: ${{ steps.tagged.outputs.release_needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history + tags: the tag check below needs every existing tag
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # `[project] version` in pyproject.toml is the single source of truth:
      # __version__ reads the installed package metadata, so there is no
      # second place to bump. tomllib is stdlib on 3.11+, and the runner's
      # preinstalled python is new enough, so no setup-python step is needed.
      - name: Read version from pyproject.toml
        id: getversion
        run: |
          version="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-]?[0-9A-Za-z.]+)?$'; then
            echo "::error::unexpected version string in pyproject.toml: '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version: $version"

      # Release only if this version has no tag yet. This is what makes the
      # workflow idempotent and safe to re-run.
      - name: Check whether v<version> is already tagged
        id: tagged
        env:
          VERSION: ${{ steps.getversion.outputs.version }}
        run: |
          if git show-ref --tags --verify --quiet -- "refs/tags/v${VERSION}"; then
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
            echo "v${VERSION} is already tagged - nothing to release"
          else
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
            echo "v${VERSION} has no tag yet - will release"
          fi

  # The gates. Reusing the test and pre-commit workflows means the release is
  # blocked by the exact same jobs that guard PRs (including the wheel smoke
  # test on Linux, macOS and Windows), with no polling. Both run in parallel
  # off `version`.
  #
  # The calls keep `./` and silence zizmor's self-repository audit, which
  # wants GitHub's newer `$/` syntax that actionlint v1.7.12 rejects
  # (rhysd/actionlint#711, #732), as in the analyzer.
  test:
    name: Test
    needs: version
    if: needs.version.outputs.release_needed == 'true'
    uses: ./.github/workflows/test.yaml # zizmor: ignore[self-repository]

  pre-commit:
    name: pre-commit
    needs: version
    if: needs.version.outputs.release_needed == 'true'
    uses: ./.github/workflows/pre-commit.yaml # zizmor: ignore[self-repository]
    with:
      # a push only carries its own diff; a release checks the whole tree
      all-files: true

  release:
    name: Tag, release and publish
    needs: [version, test, pre-commit]
    runs-on: ubuntu-latest
    # Gates the whole job - tag, GitHub release and PyPI upload - so an
    # environment protection rule (required reviewer, branch restriction)
    # stops a release before anything is created. The name must match the
    # `Environment name` of the PyPI trusted publisher exactly: PyPI checks the
    # `environment` claim in the OIDC token.
    environment: pypi
    permissions:
      # contents: write - create the release (and so the tag) and upload assets
      # id-token: write - OIDC for PyPI trusted publishing
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # setup-python, then the uv version pinned in .pre-commit-config.yaml;
      # the same action test.yaml and pre-commit.yaml use
      - uses: ./.github/actions/install-uv # zizmor: ignore[self-repository]
        with:
          python-version: "3.13"

      - name: uv build (wheel + sdist)
        run: uv build

      # `sha256sum -c`-verifiable, with no directory prefix, so it checks out
      # wherever the assets are downloaded to
      - name: Compute SHA-256 checksums
        working-directory: dist
        run: |
          sha256sum ./*.whl ./*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Created as a DRAFT and published only at the end, once PyPI has the
      # package. That keeps this compatible with GitHub's immutable releases,
      # which lock a release's assets at publication. A draft does not create
      # its tag either: `--target` is recorded now, the tag appears on publish.
      # If a re-run finds the draft from a failed attempt, it replaces the
      # assets (--clobber) instead of creating a second draft. The gh CLI is
      # preinstalled, so no third-party action to pin and no git push.
      - name: Create the draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx true; then
            echo "draft v${VERSION} exists from an earlier attempt; replacing its assets"
            gh release upload "v${VERSION}" --repo "$GITHUB_REPOSITORY" --clobber \
              dist/*.whl dist/*.tar.gz dist/SHA256SUMS.txt
          else
            gh release create "v${VERSION}" --repo "$GITHUB_REPOSITORY" \
              --draft \
              --target "${GITHUB_SHA}" \
              --title "v${VERSION}" \
              --notes "Draft: publishing to PyPI." \
              dist/*.whl dist/*.tar.gz dist/SHA256SUMS.txt
          fi

      # Trusted publishing: `uv publish` speaks OIDC natively given id-token:
      # write, so there is no long-lived API token to store and no
      # pypa/gh-action-pypi-publish pin to maintain. Needs a PyPI trusted
      # publisher (or pending publisher) for this repo with workflow
      # `tag_and_release.yaml` and environment `pypi`.
      # The explicit globs keep SHA256SUMS.txt out of the upload. --check-url
      # skips files PyPI already has, so a re-run after a partial upload
      # finishes the job instead of failing on "File already exists".
      - name: Publish to PyPI (trusted publishing)
        run: >-
          uv publish --trusted-publishing always
          --check-url https://pypi.org/simple/
          dist/*.whl dist/*.tar.gz

      # GitHub's own generated notes with the checksums appended, so the
      # hashes are readable in the release body as well as downloadable.
      - name: Build release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          notes_file="${RUNNER_TEMP}/release-notes.md"
          if ! gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
                --method POST \
                -f "tag_name=v${VERSION}" \
                -f "target_commitish=${GITHUB_SHA}" \
                --jq '.body' > "$notes_file"; then
            echo "::warning::could not generate release notes; falling back to a plain body"
            printf 'Release v%s\n' "${VERSION}" > "$notes_file"
          fi
          # The backticks below are Markdown in release-note text, not command
          # substitutions; single quotes keep them literal.
          # shellcheck disable=SC2016
          {
            printf '\n## Install\n\n'
            printf '```bash\nuvx bigfix-relevance-debugger@%s\n```\n' "${VERSION}"
            printf '\n## SHA-256\n\n'
            printf 'Verify with `sha256sum -c SHA256SUMS.txt`:\n\n'
            printf '```\n'
            cat dist/SHA256SUMS.txt
            printf '```\n'
          } >> "$notes_file"
          echo "NOTES_FILE=$notes_file" >> "$GITHUB_ENV"
          cat "$notes_file"

      # Publishing is the last step and the point where the tag is created
      # and, with immutable releases on, everything is locked.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release edit "v${VERSION}" --repo "$GITHUB_REPOSITORY" \
            --notes-file "${NOTES_FILE}" \
            --draft=false
