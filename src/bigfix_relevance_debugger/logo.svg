<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="title">
  <title id="title">BigFix Relevance Analyzer</title>
  <defs>
    <!-- Lens rim: a thick ring with a slot cut above-left of centre so it
         reads as a lowercase "b", a nod to (not a copy of) the BigFix mark. -->
    <mask id="rim">
      <circle cx="54" cy="54" r="33" fill="#fff"/>
      <circle cx="54" cy="54" r="21" fill="#000"/>
      <rect x="33" y="0" width="12" height="54" fill="#000"/>
    </mask>
  </defs>
  <rect width="128" height="128" rx="26" fill="#ffffff"/>
  <!-- handle -->
  <line x1="81" y1="81" x2="105" y2="105" stroke="#7599be" stroke-width="15" stroke-linecap="round"/>
  <rect width="128" height="128" fill="#7599be" mask="url(#rim)"/>
  <!-- parse tree seen through the lens -->
  <g stroke="#3d5f82" stroke-width="2.5" stroke-linecap="round">
    <line x1="52" y1="44.5" x2="43" y2="55.5"/>
    <line x1="52" y1="44.5" x2="60" y2="54.5"/>
    <line x1="60" y1="54.5" x2="55" y2="65.5"/>
    <line x1="60" y1="54.5" x2="65" y2="64.5"/>
  </g>
  <circle cx="52" cy="44.5" r="5" fill="#adc447"/>
  <circle cx="43" cy="55.5" r="3.8" fill="#3d5f82"/>
  <circle cx="60" cy="54.5" r="3.8" fill="#3d5f82"/>
  <circle cx="55" cy="65.5" r="3.2" fill="#adc447"/>
  <circle cx="65" cy="64.5" r="3.2" fill="#adc447"/>
</svg>
