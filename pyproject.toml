[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bigfix-relevance-debugger"
version = "0.5.3"
description = "A browser GUI for BigFix client and session relevance: live static analysis, evaluation with qna and the REST API / BigFix Explorer / Web Reports, and a per-level breakdown."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "JGStew", email = "admin@jgstew.com" },
]
requires-python = ">=3.11"
keywords = ["bigfix", "qna", "client-relevance", "session-relevance", "rest-api", "bigfix-explorer", "web-reports", "relevance", "debugger", "nicegui"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: System Administrators",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]
dependencies = [
    "bigfix-relevance-analyzer>=1.35.0,<2",
    "bigfix-remote-client-relevance>=1.5.2,<2",
    "bigfix-remote-session-relevance>=0.5.0,<1",
    "nicegui[native]>=3.18.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[project.scripts]
bigfix-relevance-debugger = "bigfix_relevance_debugger.app:main"

[project.urls]
Homepage = "https://github.com/jgstew/bigfix-relevance-debugger"
Issues   = "https://github.com/jgstew/bigfix-relevance-debugger/issues"
Source   = "https://github.com/jgstew/bigfix-relevance-debugger"

# --- Build backend ---------------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["src/bigfix_relevance_debugger"]

# --- uv --------------------------------------------------------------------

[tool.uv]
python-preference = "managed"
# Delay dependency resolution by 7 days so newly published (possibly broken
# or compromised) releases aren't picked up immediately. This governs uv.lock
# (development and CI); `uvx bigfix-relevance-debugger` users resolve fresh
# within the lower bounds in [project] dependencies.
exclude-newer = "7 days"
# jgstew's own libraries are exempt: this app is developed alongside them and
# often needs a release the day it ships. "0 days" means no delay; unlike a
# fixed date it never goes stale.
# Any temporary exemption for another package goes here too, with its end
# date; tests/unit/test_repo_config.py keeps this list in step and fails once
# a temporary entry is past its date.
exclude-newer-package = { bigfix-relevance-analyzer = "0 days", bigfix-remote-client-relevance = "0 days", bigfix-remote-session-relevance = "0 days" }
# relative `exclude-newer` durations need a recent uv
required-version = ">=0.12"

# --- Tooling ---------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Logging, never print -- same rule as bigfix-remote-client-relevance.
extend-select = ["T20"]
